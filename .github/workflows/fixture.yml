name: Candidate protection fixture
on:
  push:
    branches: ['codex/integration-*']
permissions: {}
jobs:
  linux:
    name: Candidate (linux-x86_64)
    runs-on: ubuntu-latest
    env:
      HOLD: '0'
    steps: &fixture
      - name: Exercise platform completion
        run: |
          sleep "$HOLD"
          [[ "$GITHUB_REF_NAME" != *failure || "$HOLD" != 0 ]]
  mac:
    name: Candidate (macos-arm64)
    runs-on: macos-26
    env:
      HOLD: '300'
    steps: *fixture
  gate:
    name: Candidate gate
    runs-on: ubuntu-latest
    needs: linux
    if: always()
    env:
      LINUX_RESULT: ${{ needs.linux.result }}
    steps:
      - run: test "$LINUX_RESULT" = success
